<main class="flex min-h-screen items-center justify-center bg-surface-muted px-4">
  <form
    [formGroup]="formulario"
    (ngSubmit)="entrar()"
    class="w-full max-w-sm rounded-xl border border-border bg-surface p-6 shadow-sm"
  >
    <!-- Marca del producto -->
    <div class="flex items-center gap-3">
      <span
        class="flex h-11 w-11 items-center justify-center rounded-xl bg-primary text-lg font-semibold text-surface"
        aria-hidden="true"
        >S</span
      >
      <div>
        <h1 class="text-xl font-semibold">BeanFlow</h1>
        <p class="text-sm text-text-muted">Panel de administración</p>
      </div>
    </div>

    <label class="mt-6 block text-sm font-medium" for="correo">Correo</label>
    <input
      id="correo"
      type="email"
      formControlName="correo"
      autocomplete="username"
      placeholder="tu@correo.com"
      class="mt-1 h-11 w-full rounded-lg border border-border bg-surface px-3 outline-none focus:border-primary"
    />

    <div class="mt-4 flex items-center justify-between">
      <label class="block text-sm font-medium" for="clave">Clave</label>
      <a
        href="mailto:{{ correoSoporte }}?subject=Restablecer clave"
        class="text-sm text-primary hover:underline"
        >¿Olvidaste tu clave?</a
      >
    </div>
    <div class="relative mt-1">
      <input
        id="clave"
        [type]="verClave() ? 'text' : 'password'"
        formControlName="clave"
        autocomplete="current-password"
        class="h-11 w-full rounded-lg border border-border bg-surface px-3 pr-11 outline-none focus:border-primary"
      />
      <button
        type="button"
        (click)="verClave.set(!verClave())"
        [attr.aria-label]="verClave() ? 'Ocultar clave' : 'Mostrar clave'"
        [attr.aria-pressed]="verClave()"
        class="absolute inset-y-0 right-0 flex w-11 items-center justify-center text-text-muted hover:text-text"
      >
        <svg
          class="h-5 w-5"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          @if (verClave()) {
            <!-- ojo tachado -->
            <path
              d="M9.88 9.88a3 3 0 1 0 4.24 4.24M6.72 6.72C4.4 8.35 3 10.28 2 12c1.73 3.18 5.39 6.5 10 6.5 1.67 0 3.24-.36 4.62-.97M10.59 5.09A9.77 9.77 0 0 1 12 5c4.61 0 8.27 3.32 10 6.5a12.7 12.7 0 0 1-2.16 2.87"
            />
            <path d="m2 2 20 20" />
          } @else {
            <!-- ojo -->
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z" />
            <circle cx="12" cy="12" r="3" />
          }
        </svg>
      </button>
    </div>

    <label class="mt-4 flex min-h-11 cursor-pointer items-center gap-2">
      <input
        type="checkbox"
        formControlName="recordar"
        class="h-4 w-4 rounded border-border accent-primary"
      />
      <span class="text-sm text-text">Recordar mi correo en este equipo</span>
    </label>

    @if (error()) {
      <p class="mt-3 text-sm text-danger" role="alert">{{ error() }}</p>
    }

    <button
      type="submit"
      [disabled]="formulario.invalid || cargando()"
      class="mt-4 h-11 w-full rounded-lg bg-primary font-medium text-surface hover:bg-primary-hover disabled:opacity-50"
    >
      {{ cargando() ? 'Ingresando…' : 'Entrar' }}
    </button>
  </form>
</main>
